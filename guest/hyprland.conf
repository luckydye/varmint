# Desktop of the guest user. Seed your own ~/.config/hypr/hyprland.conf to replace it.
monitor = , preferred, auto, 1

exec-once = /usr/local/libexec/varmint-clipboard-agent
exec-once = /usr/local/libexec/varmint-display-fit

# varmint does not draw the virtio-gpu cursor plane.
cursor {
    no_hardware_cursors = true
}

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
